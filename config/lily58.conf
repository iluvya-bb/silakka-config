# 1. Identity
CONFIG_ZMK_KEYBOARD_NAME="Eladio"

# 2. Display Settings (nice!view)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# Gives the display its own processing thread so it doesn't glitch while typing
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# Use the nice-view-gem custom status screen (animated) instead of the stock layout.
# The gem animation is on by default; it draws its own battery/WPM/layer widgets.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# 3. ZMK Studio Support (Disabled to prevent ghost memory conflicts)
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_STUDIO_LOCKING=n

# 4. Bluetooth Connection & Stability
# Boosts Bluetooth radio power to maximum to prevent dropped signals
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Forces the new, highly stable Zephyr Bluetooth pairing protocol
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Uses the nRF52840's internal RC oscillator for the 32kHz clock instead of an
# external crystal. Fixes random/unprompted disconnects caused by a flaky or
# missing crystal (common on nice!nano clones). Tradeoff: slightly higher idle
# power draw. If your disconnects are already gone, you can remove this line.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# 5. Battery Reporting
# Master switch for battery detection/reporting (required for any battery readout)
CONFIG_ZMK_BATTERY_REPORTING=y
# Central reports its own + the peripheral's level, and fetches the peripheral's
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# 6. Power Management & Deep Sleep (30 mins)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# 7. Screen Conflict Resolution
# Disables old OLED drivers so the nice!view SPI driver can work
CONFIG_SSD1306=n
# Ensures the board can physically cut/supply power to the screen
CONFIG_ZMK_EXT_POWER=y

# 8. Typing Latency Optimization (Eager Debounce)
# Makes the keys register instantly when pressed, but prevents double-typing on release
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# 9. HID
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
