# 1. Identity
CONFIG_ZMK_KEYBOARD_NAME="Eladio"

# 2. Display Settings (nice!view)
CONFIG_ZMK_DISPLAY=y
# This keeps the screen on even when idle (battery impact is tiny)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# 3. ZMK Studio Support
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# 4. Bluetooth & Power Performance
# Stronger signal between halves
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Battery reporting for both halves
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# 5. Deep Sleep (30 mins)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
