# 1. Identity
CONFIG_ZMK_KEYBOARD_NAME="Eladio"

# 2. Display Settings (nice!view)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# Required for nice!view specifically
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# 3. ZMK Studio Support
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_STUDIO_LOCKING=n

# 4. Bluetooth & Power Performance
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# 5. Deep Sleep (30 mins)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# 6. Battery fix for V1 nice!nano
# Tells ZMK to use the physical pin P0.04 (v1 hardware)
CONFIG_ZMK_BATTERY_REPORTING=y
